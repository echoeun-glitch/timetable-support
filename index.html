<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ✏️ 고치는 곳 1 — 브라우저 탭에 뜨는 이름 -->
<title>시간표 앱</title>

<!-- 검색엔진에 안 걸리게 막는 줄. 지우지 마세요. -->
<meta name="robots" content="noindex, nofollow">

<style>
  /* ===== 색 정하는 곳 ===== */
  :root {
    --bg: #FFFBFF;
    --card: #FFFFFF;
    --text: #1D1B20;
    --dim: #79747E;
    --line: #E7E0EC;
    --brand: #3F51B5;      /* ✏️ 고치는 곳 2 — 앱 테마색과 맞추면 예뻐요 */
    --kakao: #FEE500;
    --kakao-text: #191600;
  }
  /* 폰이 어두운 테마일 때 자동으로 바뀝니다 */
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141218;
      --card: #1D1B20;
      --text: #E6E0E9;
      --dim: #948F99;
      --line: #322F35;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 20px 56px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Malgun Gothic", "맑은 고딕", sans-serif;
    line-height: 1.7;
    -webkit-text-size-adjust: 100%;
  }

  main { max-width: 420px; margin: 0 auto; }

  /* 맨 위 아이콘 */
  .icon {
    width: 64px; height: 64px;
    margin: 0 auto 20px;
    border-radius: 16px;
    background: var(--brand);
    display: flex; align-items: center; justify-content: center;
  }
  .icon span { display: block; width: 30px; height: 3px; background: #fff; border-radius: 2px; box-shadow: 0 8px 0 #fff, 0 16px 0 #fff; }

  h1 { font-size: 22px; text-align: center; margin: 0 0 8px; font-weight: 600; }

  .sub { text-align: center; color: var(--dim); font-size: 14px; margin: 0 0 32px; }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 24px 20px;
    margin-bottom: 16px;
  }

  .card p { margin: 0 0 14px; font-size: 15px; }
  .card p:last-child { margin-bottom: 0; }

  /* 카카오페이 버튼 */
  .pay {
    display: block;
    background: var(--kakao);
    color: var(--kakao-text);
    text-align: center;
    text-decoration: none;
    font-size: 16px;
    font-weight: 700;
    padding: 16px;
    border-radius: 12px;
    margin-top: 20px;
  }
  .pay:active { opacity: .8; }

  /* Play 정책 때문에 꼭 필요한 안내 */
  .note {
    font-size: 13px;
    color: var(--dim);
    text-align: center;
    margin-top: 14px;
  }

  footer {
    text-align: center;
    font-size: 13px;
    color: var(--dim);
    margin-top: 32px;
  }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<main>

  <div class="icon"><span></span></div>

  <!-- ✏️ 고치는 곳 3 — 앱 이름 -->
  <h1>시간표</h1>
  <p class="sub">아이 시간표를 홈 화면 위젯으로</p>

  <div class="card">
    <p>안녕하세요.</p>
    <p>
      아이 학원 시간을 자꾸 까먹어서, 홈 화면에서 바로 보이면 좋겠다는
      생각에 만든 앱이에요.
    </p>
    <p>
      광고도 없고, 인터넷도 안 쓰고, 아무 정보도 가져가지 않습니다.
      적어 넣으신 시간표는 폰 안에만 있어요.
    </p>
    <p>
      혹시 잘 쓰고 계시다면, 커피 한 잔 정도로 응원해 주셔도 좋고
      안 하셔도 전혀 괜찮습니다.
    </p>

    <!-- ✏️ 고치는 곳 4 — 아래 # 자리에 카카오페이 송금 링크를 넣으세요 -->
    <a class="pay" href="#">☕ 커피 한 잔 후원하기</a>

    <p class="note">
      후원하셔도 앱에서 달라지는 건 없어요.<br>
      그냥 고맙습니다.
    </p>
  </div>

  <footer>
    <!-- 앱 전용 문의 메일 -->
    문의: <a href="mailto:sksmsroqkfwk2026@gmail.com">sksmsroqkfwk2026@gmail.com</a>
  </footer>

</main>
</body>
</html>
